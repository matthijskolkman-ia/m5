name: FindMyTrigger
options:
  bundleIdPrefix: com.findmy
  deploymentTarget:
    macOS: "14.0"

targets:
  FindMyTrigger:
    type: application
    platform: macOS
    sources: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.findmy.trigger
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_LSUIElement: "YES"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: "Find My Phone"
        CFBundleDisplayName: "Find My Phone"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        LSUIElement: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Find My Trigger"
            CFBundleTypeRole: "Viewer"
            LSHandlerRank: "Default"
