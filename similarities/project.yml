name: Similarities
options:
  bundleIdPrefix: com.similarities
  deploymentTarget:
    macOS: "14.0"

targets:
  Similarities:
    type: application
    platform: macOS
    sources: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.similarities.app
        SWIFT_VERSION: "5.9"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Similarities
        CFBundleDisplayName: Similarities
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
