name: FolderViewer
options:
  bundleIdPrefix: com.thijs.folderviewer
  deploymentTarget:
    macOS: "14.0"

targets:
  FolderViewer:
    type: application
    platform: macOS
    sources: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thijs.folderviewer
        SWIFT_VERSION: "5.9"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: FolderViewer
        CFBundleDisplayName: FolderViewer
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        LSUIElement: false
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
