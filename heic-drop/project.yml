name: HeicDrop
options:
  bundleIdPrefix: com.heicdrop
  deploymentTarget:
    macOS: "14.0"

targets:
  HeicDrop:
    type: application
    platform: macOS
    sources: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heicdrop.app
        SWIFT_VERSION: "5.9"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: "HeicDrop"
        CFBundleDisplayName: "HeicDrop"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
